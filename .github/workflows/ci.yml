name: CI

# Unit tests and checks, then the end-to-end jobs: each supported RT release is
# built from its pinned source (cached between runs), run on PostgreSQL and on
# MySQL, filled with the seed script, exported, and the bundle validated.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src

  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rt: ["4.4.9", "5.0.11", "6.0.4"]
        db: [pg, mysql]
    env:
      RT_VERSION: ${{ matrix.rt }}
      DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v7
      - name: Make room for the RT image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Build arguments of this RT release
        id: rt
        run: make -s fixture-build-args >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build RT (cached)
        uses: docker/build-push-action@v6
        with:
          context: fixture
          build-args: |
            RT_BASE_IMAGE=${{ steps.rt.outputs.RT_BASE_IMAGE }}
            RT_VERSION=${{ steps.rt.outputs.RT_VERSION }}
            RT_COMMIT=${{ steps.rt.outputs.RT_COMMIT }}
          tags: specivo-rt-fixture:${{ matrix.rt }}
          load: true
          cache-from: type=gha,scope=rt-fixture-${{ matrix.rt }}
          cache-to: type=gha,mode=max,scope=rt-fixture-${{ matrix.rt }}
      - run: make fixture-up
      - run: make fixture-seed
      - run: make fixture-files
      - name: Fixture -> bundle -> validate
        run: make fixture-test
      - run: make fixture-export
      - if: failure()
        run: docker compose ls && docker ps -a && docker logs $(docker ps -aq --filter name=rt-) 2>&1 | tail -100
      - if: always()
        run: make fixture-down
